# Training run: captioner_lora
model_config: configs/model/captioner.yaml
run_name: captioner_lora
output_dir: train/captioner_lora
seed: 1337

num_train_epochs: 1.0
max_steps: 2000
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true

logging_steps: 25
eval_strategy: steps
eval_steps: 250
save_strategy: steps
# 150 steps is a bounded amount of work to lose. 500 meant an interrupted run threw away
# nearly two hours.
save_steps: 150
save_total_limit: 6
load_best_model_at_end: true
dataloader_num_workers: 4
remove_unused_columns: false
resume_from_checkpoint: auto
