[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satquery"
version = "0.1.0"
description = "Model layer of SatQuery AI: agentic vision-language analysis of remote sensing imagery (SIH 2026, SIH26167)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Base group: everything the preprocessing, io, contract and registry code needs.
# Deliberately CPU-only, so the pure-function work installs on a laptop without CUDA.
dependencies = [
    "numpy>=1.26,<3",
    "rasterio>=1.3",
    "affine>=2.4",
    "scipy>=1.11",
    "pydantic>=2.7",
    "omegaconf>=2.3",
    "pyyaml>=6",
    "pillow>=10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU group: the learned models. Not needed to run `make test`, `make smoke` or
# `make registry`. Install with `make install-gpu`.
gpu = [
    "torch>=2.2",
    "torchvision>=0.17",
    # <5 is a hard upper bound, not caution. transformers 5 rewrote the generation
    # loop (`_prefill`, `is_first_iteration`) and the EarthDial/InternVL remote code is
    # written against the 4.x contract: it loads fine on 5.x but fails at generate()
    # with `position_ids.view(-1, 0)`. See REMOTE_CODE_PATCHES in models/vlm/backbone.py
    # for the shims that get it as far as loading. Verified working on 4.49.0.
    "transformers>=4.44,<5",
    "peft>=0.12",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "timm>=1.0",
    "sentencepiece>=0.2",
    "einops>=0.8",
    "tensorboard>=2.16",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/satquery"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["scratch", "artifacts", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function call in default argument: frozen constants are intentional here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not gpu and not slow'"
markers = [
    "gpu: requires a GPU and the `gpu` optional dependency group",
    "slow: excluded from the default run",
]
