# Discriminative CDVQA change head: Siamese image encoder + question encoder + a
model_config: configs/model/change_head.yaml
# linear classifier over the six frozen CDVQA classes. The VLM handles free-form
# change description; this head produces the scored CDVQA answer.
# Keys map one-for-one onto satquery.train.change_head.ChangeHeadTrainConfig.
# There is no num_labels key: it is len(CDVQA_ANSWERS) from preprocess/constants.py.

data_config: configs/data/cdvqa.yaml

run_name: change_head
output_dir: train/change_head
seed: 1337

# --- architecture --------------------------------------------------------------------
# ResNet-50 rather than a ViT: CDVQA is only ~3k pairs, so a small convolutional
# encoder with ImageNet weights overfits far less at this data scale.
image_encoder: timm/resnet50.a1_in1k
freeze_image_encoder: false
# Questions are templated and low-diversity, so the text tower is frozen and used
# purely as a sentence embedder.
text_encoder: distilbert-base-uncased
freeze_text_encoder: true
fusion_hidden_dim: 512
classifier_dropout: 0.1
# CDVQA ships 512x512 SECOND crops; no resize, so nothing is lost before the encoder.
image_size: 512
label_smoothing: 0.0

# --- TrainingArguments ------------------------------------------------------------------
# The head is tiny and the dataset small, so many epochs are cheap; best checkpoint
# is selected on eval accuracy rather than the last one being kept.
num_train_epochs: 3.0
max_steps: -1
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
gradient_accumulation_steps: 1
learning_rate: 3.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
# Not needed: the whole model fits comfortably, and checkpointing would only cost speed.
gradient_checkpointing: false
logging_steps: 50
eval_strategy: steps
eval_steps: 500
save_strategy: steps
save_steps: 500
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_accuracy
greater_is_better: true
dataloader_num_workers: 6
remove_unused_columns: false
report_to: null

throughput_log_every_n_steps: 50

max_eval_samples: 2000