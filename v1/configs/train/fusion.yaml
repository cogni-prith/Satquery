# Stage-1 fusion training on the co-registered reBEN Sentinel-1 / Sentinel-2 pairs.
#
# `metric_for_best_model` is mean IoU, never accuracy. Built-up is absent from 84% of
# reBEN patches and water from 73%, so predicting background everywhere scores about
# 96% pixel accuracy while extracting nothing.

model_config: configs/model/fusion.yaml

# Training reads the packed cache, not the LMDB. The LMDB lives on a spinning USB
# drive: 1,009 keys/s sequentially, but ~1 patch/s randomly, which is what a shuffled
# epoch does. Build the cache once with scripts/pack_fusion_cache.py.
packed_cache: ~/satquery-cache/fusion_packed

train_split: train
eval_split: validation
max_train_samples: -1       # all of whatever the packed cache holds
max_eval_samples: 6000

run_name: fusion_stage1
output_dir: train/fusion_stage1
seed: 42

num_train_epochs: 2.0
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
learning_rate: 3.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true

logging_steps: 50
eval_strategy: steps
eval_steps: 1000
save_strategy: steps
save_steps: 1000
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_mean_iou
greater_is_better: true
dataloader_num_workers: 8
